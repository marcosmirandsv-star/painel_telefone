name: Homologacao Sistema

on:
  push:
    branches:
      - homologacao
  pull_request:
    branches:
      - homologacao
      - main

jobs:
  homologation-tests:
    if: github.ref == 'refs/heads/homologacao' || github.base_ref == 'homologacao' || github.head_ref == 'homologacao'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Schedule tests
        run: npm run test:schedule

      - name: Existing integration tests
        run: npm run test:integrations

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          NEXT_PUBLIC_SCHEDULE_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SCHEDULE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm run build
