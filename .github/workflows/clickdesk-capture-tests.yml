name: ClickDesk Captura - Testes Isolados

on:
  push:
    branches:
      - work/clickdesk-captura-segura-20261008

permissions:
  contents: read

jobs:
  capture-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Testar captura humana
        run: node --experimental-transform-types --test tests/clickdesk-human-capture.test.mts tests/clickdesk-audit-controls.test.mts tests/clickdesk-audit-events.test.mts tests/clickdesk-coverage.test.mts tests/clickdesk-official-resolutions.test.mts tests/clickdesk-ticket-productivity.test.mts tests/clickdesk-rest-evidence.test.mts tests/clickdesk-discovery.test.mts tests/clickdesk-human-contributions.test.mts tests/clickdesk-human-message.test.mts tests/clickdesk-verified-productivity.test.mts
      - name: Verificar tipos (baseline legado isolado)
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/tsc-output.log 2>&1
          status=$?
          set -e
          cat /tmp/tsc-output.log
          if [ "$status" -eq 0 ]; then exit 0; fi
          grep 'error TS' /tmp/tsc-output.log > /tmp/ts-errors.log || true
          count=$(wc -l < /tmp/ts-errors.log)
          if [ "$count" -ne 5 ]; then echo 'Unexpected TypeScript errors'; exit 1; fi
          if grep -Ev '^tests/chat-operation-360.test.mts\((137|203|421|500|534),5\): error TS2322:' /tmp/ts-errors.log; then
            echo 'New TypeScript errors detected'; exit 1
          fi
          echo 'Only 5 independently confirmed pre-existing 360 test fixture typing errors remain.'
